name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Marketplace Trusted Publishing policy "jsonl-vision release" matches
# .github/workflows/release.yml with an empty GitHub environment. Do not set
# a job environment: that changes the OIDC subject and the exchange fails.
# id-token: write lets vsce request the GitHub OIDC token. contents: write
# lets this job create the GitHub release.
permissions:
  contents: write
  id-token: write

# The pnpm workspace is jsoncrack.com/, not the repository root.
defaults:
  run:
    working-directory: jsoncrack.com
    shell: bash

jobs:
  release:
    name: Publish the VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: jsoncrack.com/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the extension version
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/vscode/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match jsoncrack.com/apps/vscode/package.json version ${version}."
            exit 1
          fi

      - name: Package the extension
        id: package
        run: |
          set -euo pipefail
          pnpm --filter jsoncrack-react run build
          pnpm --filter jsonl-vision run vsc:package
          version="$(node -p "require('./apps/vscode/package.json').version")"
          vsix="apps/vscode/jsonl-vision-${version}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::vsce package did not produce ${vsix}"
            exit 1
          fi
          echo "vsix=${GITHUB_WORKSPACE}/jsoncrack.com/${vsix}" >> "$GITHUB_OUTPUT"

      # Trusted Publishing: vsce 4.1.0 exchanges one GitHub OIDC token
      # (audience marketplace.visualstudio.com) for a short-lived Marketplace
      # credential. --oidc and --packagePath are both supported; --oidc does
      # not fall back to a PAT. Do not set VSCE_PAT here — the CLI rejects
      # --oidc together with --pat. ovsx 1.3.0 treats a .vsix --packagePath
      # as an already-built package, so both registries get this same file.
      - name: Publish to the VS Code Marketplace
        if: always() && steps.package.outcome == 'success'
        run: |
          set -euo pipefail
          unset VSCE_PAT
          npx --yes @vscode/vsce@4.1.0 publish --packagePath "${{ steps.package.outputs.vsix }}" --oidc

      - name: Check OVSX_PAT
        id: ovsx_pat
        if: always() && steps.package.outcome == 'success'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${OVSX_PAT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Open VSX skipped::OVSX_PAT is not set. Skipping ovsx publish. Add the OVSX_PAT repository secret and re-run this workflow to publish there. Open VSX also requires the Eclipse publisher agreement and the cyclone-mind namespace."
          fi

      - name: Publish to Open VSX
        if: always() && steps.package.outcome == 'success' && steps.ovsx_pat.outputs.present == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          npx --yes ovsx@1.3.0 publish --packagePath "${{ steps.package.outputs.vsix }}"

      - name: Attach the VSIX to the GitHub release
        if: always() && steps.package.outcome == 'success'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          vsix="${{ steps.package.outputs.vsix }}"
          title="JSONL Vision ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" --title "$title" --generate-notes
          fi
